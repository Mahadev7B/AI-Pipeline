<title>Idea Desk</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --panel2:#1a1e24; --panel3:#20252d;
    --border:#242830; --border2:#323844; --hair:#1c2027;
    --text:#eae8e3; --text2:#9aa0a8; --text3:#666c74; --dim:#4c525a;
    --accent: oklch(78% 0.14 75); --accent-soft: oklch(78% 0.14 75 / 0.13); --accent-ink:#141007;
    --gray:#7d848d;
    --blue: oklch(72% 0.12 250); --blue-soft: oklch(72% 0.12 250 / 0.12);
    --violet: oklch(72% 0.13 300); --violet-soft: oklch(72% 0.13 300 / 0.12);
    --green: oklch(72% 0.15 150); --green-soft: oklch(72% 0.15 150 / 0.13);
    --red: oklch(66% 0.17 25); --red-soft: oklch(66% 0.17 25 / 0.12);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent);text-decoration:none;} a:hover{color:var(--text);}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
  button:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  textarea,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border2);border-radius:9px;padding:12px 14px;width:100%;}
  textarea{min-height:150px;resize:vertical;line-height:1.6;}
  textarea::placeholder,input::placeholder{color:var(--text3);}
  .mono{font-family:var(--mono);}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px 120px;}

  /* top bar */
  .top{position:sticky;top:0;z-index:20;background:color-mix(in oklab, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);}
  .top-in{max-width:1180px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:18px;}
  .brand{font-weight:700;letter-spacing:-0.01em;font-size:15px;display:flex;align-items:center;gap:10px;}
  .brand .sq{width:12px;height:12px;border-radius:3px;background:var(--accent);}
  .crumb{color:var(--text3);font-size:13px;display:flex;gap:8px;align-items:center;}
  .crumb b{color:var(--text2);font-weight:500;}
  .mock{margin-left:auto;font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:8px;}
  .mock .pill{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid var(--border2);color:var(--text2);}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:600;border:1px solid var(--border2);background:var(--panel);color:var(--text);transition:background .12s,border-color .12s;}
  .btn:hover{background:var(--panel2);border-color:var(--text3);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ok{background:var(--green);color:#06140c;border-color:transparent;}
  .btn.ghost{border-color:transparent;color:var(--text2);}
  .btn.ghost:hover{color:var(--text);background:var(--panel);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}

  /* status pills */
  .st{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 9px;border-radius:6px;border:1px solid;}
  .st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .st.draft{color:var(--text2);border-color:var(--border2);}
  .st.evaluated{color:var(--violet);border-color:oklch(72% 0.13 300 / .5);background:var(--violet-soft);}
  .st.approved{color:var(--green);border-color:oklch(72% 0.15 150 / .5);background:var(--green-soft);}
  .st.parked{color:var(--text2);border-color:var(--border2);background:var(--panel2);}
  .st.dropped{color:var(--text3);border-color:var(--border);}
  .banner.gray{border-color:var(--border2);background:var(--panel);color:var(--text2);}
  .st.working{color:var(--accent);border-color:oklch(78% 0.14 75 / .5);background:var(--accent-soft);}

  /* headings */
  h1{font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;margin:0;text-wrap:balance;}
  h2{font-size:18px;font-weight:600;letter-spacing:-0.01em;margin:0;}
  .k{font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);}
  .sub{color:var(--text2);font-size:14px;max-width:60ch;}

  /* list */
  .list{display:flex;flex-direction:column;border-top:1px solid var(--border);margin-top:22px;}
  .row{display:grid;grid-template-columns:1fr auto auto;gap:22px;align-items:center;padding:18px 6px;border-bottom:1px solid var(--border);text-align:left;width:100%;}
  .row:hover{background:var(--panel);}
  .row .t{font-size:15.5px;font-weight:600;}
  .row .d{font-size:13px;color:var(--text2);margin-top:4px;max-width:70ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .when{font-size:12px;color:var(--text3);font-family:var(--mono);}
  .empty{padding:48px 0;color:var(--text3);font-size:14px;}

  /* new idea form */
  .form{max-width:720px;display:flex;flex-direction:column;gap:22px;margin-top:28px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}
  .field .hint{font-size:12px;color:var(--text3);margin-top:7px;line-height:1.55;}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .note{font-size:12.5px;color:var(--text3);line-height:1.6;max-width:62ch;}

  /* evaluating */
  .evalbox{max-width:640px;margin-top:40px;}
  .line{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--hair);opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s;}
  .line.on{opacity:1;transform:none;}
  .line .who{width:96px;flex:none;font-size:12px;font-weight:700;color:var(--text2);padding-top:2px;}
  .line .what{color:var(--text);font-size:14px;}
  .line .what small{display:block;color:var(--text3);font-size:12px;margin-top:3px;}
  .spin{width:10px;height:10px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--accent);animation:sp 1s linear infinite;display:inline-block;margin-right:8px;vertical-align:middle;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.line{transition:none;} .spin{animation:none;}}

  /* idea view */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-top:26px;flex-wrap:wrap;}
  .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--text3);}
  .meta .chip{padding:3px 9px;border-radius:6px;background:var(--panel);border:1px solid var(--border);color:var(--text2);font-size:11.5px;}
  .cols{display:grid;grid-template-columns:330px minmax(0,1fr);gap:34px;margin-top:26px;align-items:start;}
  @media (max-width:900px){.cols{grid-template-columns:1fr;} .side{position:static !important;}}
  .side{position:sticky;top:64px;display:flex;flex-direction:column;gap:18px;}
  .you{border-left:3px solid var(--gray);padding:2px 0 2px 14px;}
  .you .q{white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--text);}
  .you .k{margin-bottom:8px;}
  .you .aud{margin-top:10px;font-size:12.5px;color:var(--text2);}
  .hist{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .hist .k{margin-bottom:10px;}
  .h-item{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--hair);font-size:12.5px;color:var(--text2);align-items:start;}
  .h-item:first-of-type{border-top:0;}
  .h-item .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--border2);}
  .h-item.cur .dot{background:var(--violet);} .h-item.ok .dot{background:var(--green);} .h-item.raw .dot{background:var(--gray);}
  .h-item b{color:var(--text);font-weight:600;}
  .h-item .fb{margin-top:5px;padding:7px 9px;border-left:2px solid var(--gray);background:var(--panel2);border-radius:0 6px 6px 0;font-size:12px;white-space:pre-wrap;}

  .voices{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text3);margin-top:6px;}
  .voices span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .seg{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden;}
  .seg button{padding:6px 12px;font-size:12.5px;color:var(--text2);}
  .seg button.on{background:var(--panel2);color:var(--text);}
  .depth{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--text2);}
  .depth .chip{border:1px solid var(--border2);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text);}

  .banner{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.55;border:1px solid;}
  .banner.blue{border-color:oklch(72% 0.12 250 / .4);background:var(--blue-soft);color:var(--text);}
  .banner.green{border-color:oklch(72% 0.15 150 / .5);background:var(--green-soft);color:var(--text);}
  .banner b{font-weight:600;}

  .qs{display:flex;flex-direction:column;gap:14px;margin-top:18px;}
  .qa{border:1px solid var(--border);border-radius:12px;padding:16px 18px 14px;background:var(--panel);border-left:3px solid var(--v);}
  .qa.need{background:oklch(78% 0.14 75 / 0.05);border-color:oklch(78% 0.14 75 / .35);border-left-color:var(--accent);}
  .qa .qh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
  .qa .n{font-family:var(--mono);font-size:11px;color:var(--text3);}
  .qa .qt{font-size:14.5px;font-weight:600;}
  .qa .v{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--v);}
  .qa .a{font-size:14px;line-height:1.65;color:var(--text2);}
  .qa .a b{color:var(--text);font-weight:600;}
  .qa .a.big{font-size:16px;color:var(--text);line-height:1.55;}
  .qa .x{margin-top:10px;}
  .qa .x > button{font-size:12.5px;color:var(--accent);display:inline-flex;align-items:center;gap:6px;}
  .qa .x > button::before{content:"▸";font-size:10px;transition:transform .15s;display:inline-block;}
  .qa .x.open > button::before{transform:rotate(90deg);}
  .qa .xin{display:none;margin-top:12px;padding:14px 16px;background:var(--panel2);border-radius:9px;font-size:13px;line-height:1.65;color:var(--text2);}
  .qa .x.open .xin{display:block;}
  .xin .sk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin:12px 0 6px;}
  .xin .sk:first-child{margin-top:0;}
  .xin b{color:var(--text);font-weight:600;}
  .xin .na{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;border:1px dashed var(--border2);color:var(--text3);margin-left:8px;vertical-align:1px;}
  .lab{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--border2);color:var(--text2);}
  .lab.unk{color:var(--red);border-color:oklch(66% 0.17 25 / .5);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){.two{grid-template-columns:1fr;}}
  .dec{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-top:10px;background:var(--panel2);}
  .dec .dt{font-weight:600;color:var(--text);margin-bottom:4px;font-size:13.5px;}
  .dec .ds{font-size:12.5px;color:var(--text2);}
  .dec .ds i{color:var(--text);font-style:normal;font-weight:600;}

  .cv{margin-top:22px;border-radius:14px;border:1px solid oklch(72% 0.13 300 / .55);background:var(--panel);padding:20px 22px;}
  .cv .cvh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:baseline;}
  .cv .cvh .k{color:var(--violet);}
  .cv .cvh small{font-size:11px;color:var(--dim);}
  .cvg{display:grid;grid-template-columns:150px 1fr;gap:13px 20px;align-items:baseline;}
  .cvg .k{text-align:right;}
  .cvg .val{font-size:13.5px;line-height:1.65;color:var(--text);}
  .cvg .opp{font-size:15px;font-weight:700;}
  .rec{display:inline-block;padding:6px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;}
  @media (max-width:640px){.cvg{grid-template-columns:1fr;} .cvg .k{text-align:left;}}

  /* action bar */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in oklab, var(--bg) 90%, transparent);backdrop-filter:blur(10px);border-top:1px solid var(--border);}
  .bar-in{max-width:1180px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .bar .why{font-size:12.5px;color:var(--text3);margin-right:auto;max-width:56ch;}

  /* panels (reconsider / approve) */
  .panel{margin-top:18px;border:1px solid var(--border2);border-radius:12px;background:var(--panel);padding:18px 20px;}
  .panel h3{margin:0 0 6px;font-size:15px;}
  .panel p{margin:0 0 12px;color:var(--text2);font-size:13.5px;line-height:1.6;}
  .panel.g{border-color:oklch(72% 0.15 150 / .5);}
  .arts{display:flex;flex-direction:column;gap:8px;margin:12px 0 16px;}
  .art{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:baseline;padding:9px 12px;border-radius:8px;background:var(--panel2);font-size:13px;}
  .art .k{text-align:left;}
  .art .m{font-family:var(--mono);font-size:11.5px;color:var(--text3);}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--border2);color:var(--text);padding:10px 16px;border-radius:9px;font-size:13px;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.4);}

  .foot{margin-top:60px;padding-top:18px;border-top:1px dashed var(--border2);font-size:12px;color:var(--text3);line-height:1.7;max-width:70ch;}
  .foot button{color:var(--text2);text-decoration:underline;}
</style>

<div class="top"><div class="top-in">
  <button class="brand" onclick="go('list')"><span class="sq"></span>Idea Desk</button>
  <div class="crumb" id="crumb"></div>
  <div class="mock"><span class="pill">Mockup</span> canned answers · no AI runs · not connected to the factory</div>
</div></div>

<div class="wrap" id="app"></div>
<div id="bar"></div>

<script>
/* ---------------------------------------------------------------------------
   Idea Desk — standalone mockup of the idea-evaluation journey.
   Everything here is client-side. Evaluations are canned text so the shape of
   the experience can be judged before anything real is built.
--------------------------------------------------------------------------- */
const VOICE = {
  you:  {c:'var(--gray)',   name:'You said'},
  mean: {c:'var(--blue)',   name:'We think you mean'},
  think:{c:'var(--violet)', name:'What we think of it'},
  need: {c:'var(--accent)', name:'We recommend / need'},
  ok:   {c:'var(--green)',  name:'You approved'},
};
const QUESTIONS = [
  [1,'Did the company understand my idea?','mean','sections 1 and 2'],
  [2,'What am I really trying to achieve?','mean','section 3'],
  [3,'Why might this be worth building?','think','section 4'],
  [4,'What already exists?','think','sections 5 and 6'],
  [5,'What could make ours different?','think','section 7'],
  [6,'What could make it fail?','think','section 8'],
  [7,'What does the company recommend?','need','sections 9, 10 and 12'],
  [8,'What assumptions did the company make?','think','section 11'],
  [9,'What decisions do you need from me?','need','section 13'],
  [10,'How will we know we succeeded?','need','section 14'],
];

/* ------------------------- the Founder's own example ---------------------- */
const EX_RAW = "the current UI so much verbose, it should be as simple as a dashboard, I'M THINKING like an ellipse where we can track flow";
const EX_FEEDBACK = "almost there, UI i'm talking about is UI of my factory to track the app progress, once done the app( which is a child of my factory will hve another UI which is unrelated to ours) you got it?";

const EX_ROUND1 = {
  title: 'Progress dashboard for the app',
  depth: 'Light', depthReason: 'An internal screen for one user. Nothing outside the company changes because of it, so the market sections are not worth their cost.',
  roster: [
    ['Product','always on the roster; owns the problem, the scope and the first version.'],
    ['Design','the idea names a shape (an ellipse) before it names what goes on it; Design has to say whether the shape earns its place.'],
    ['Red Team','the fastest way to find out if a screen can be filled honestly is to ask who will try to break it.'],
  ],
  left: [['CEO, Financial, Security','no market, no cost structure, no sensitive data in play.'],['CTO','not consulted this round; nothing about the records was asked. (This turned out to be the mistake.)']],
  q: {
    1: ['<b>We read this as a request for a progress screen for the app the factory is building</b> — one page where you see how far along your product is, instead of reading task records.',
        '<div class="sk">1 · Original idea</div>Preserved verbatim on the left.<div class="sk">2 · What we think you mean</div>A single progress view, replacing the thirteen text-heavy tabs, whose subject is the product under construction.'],
    2: ['You want to open the app and know, within seconds and without reading, how close it is to done.',
        '<div class="sk">3 · What you are really trying to achieve</div>The outcome is legibility, not a chart. "Verbose" is the complaint; "dashboard" and "ellipse" are your sketch of the remedy.'],
    3: ['<b>The merit is real and it is in the legibility, not the ellipse.</b> Today every screen makes you read to learn what state something is in. A view that shows state instead of describing it is a genuine improvement for the one person it is for.',
        '<div class="sk">4 · Why this may be valuable</div>Speed to understanding · removes reading · one place instead of thirteen · it is for the person who actually looks at it every day. Weak merit we will not inflate: it does not make the factory build anything faster.'],
    4: ['<b>We don\'t know, and here is why.</b> Product-progress dashboards exist in every project tool. We did not compare them because no agent in this company can browse the web, and for an internal screen the comparison would not change the recommendation.',
        '<div class="sk">5 · Known competitors / alternatives <span class="na">NOT PRODUCED</span></div>Depth is Light. <div class="sk">6 · Competitor data freshness <span class="na">NOTHING TO LABEL</span></div><b>Standing disclosure:</b> research has not been performed. Anything we say about third parties is company recollection and would be labelled <span class="lab">COMPANY INFERENCE</span> or <span class="lab unk">UNKNOWN</span>, never <span class="lab">VERIFIED / CURRENT</span>.'],
    5: ['<b>We do not yet see a strong differentiation</b>, and at this depth we did not look for one. There is no market to be different in.',
        '<div class="sk">7 · Competitive advantages</div>Not produced as a market claim. Internally, the advantage over today is that a status is a claim and a movement is evidence.'],
    6: ['<b>Building a screen about the wrong subject.</b> If the thing you want to watch is not the app but something else, everything below is aimed at the wrong target. Second: the ellipse is the least certain part of the design and the idea commits to it first.',
        '<div class="sk">8 · Threats</div><b>Execution:</b> shape fixed before content is known. <b>Technical:</b> a screen is only as honest as the records behind it; we did not check them this round.'],
    7: ['<b>Proceed with narrowed scope: build one progress screen for the app, and do not commit to the ellipse yet.</b> One page, one subject, honest about what it cannot show. Postponed: motion, percentages and the ring itself.',
        '<div class="sk">9 · Recommended direction</div>Legibility is the requirement; geometry is a guess.<div class="two" style="margin-top:8px"><div><div class="sk">10 · In scope now</div>One screen · stage of the app · what is stopping it · whose turn</div><div><div class="sk">10 · Not in the first version</div>Ellipse geometry · animation · percentages · anything per-agent</div></div><div class="sk">12 · Alternatives</div>One: fix the navigation instead of the screen. Two, not three.'],
    8: ['One that could change everything: <b>that the subject of the screen is the app the factory builds.</b> If the subject is the factory itself, this is a different brief.',
        '<div class="sk">11 · Important assumptions</div>Subject = the child app · one user, one machine · "simple" means fewer things on screen, not fewer capabilities.'],
    9: ['One. <b>Is the subject of this screen the app, or the factory?</b> Two honest answers give two different briefs, which is the only reason it is here. You can approve without answering; we proceed on the assumption above.',
        '<div class="dec"><div class="dt">Is the subject the app, or the factory that builds it?</div><div class="ds"><i>What changes:</i> the app, and the screen shows the product\'s progress toward release. The factory, and the screen shows gates, owners and stalls across every product it is building.</div></div>'],
    10: ['You open it, and in under ten seconds you can say what stage the app is at and what is stopping it, without opening anything else.',
        '<div class="sk">14 · Definition of success</div>QA test: a person who has never seen the records answers "where is it and what is it waiting on" correctly from this screen alone.'],
  },
  view: {opp:'High', why:'The complaint is observed, not assumed: the current screens make you read to learn state. The fix is cheap relative to what it removes. The one thing that could sink it is the subject question, and that is one answer away.', merit:'It replaces reading with looking.', threat:'We may have understood the subject wrong.', diff:'None we can see, and we did not look — there is no market here.', rec:'Proceed with narrowed scope'},
  changed: null,
};

const EX_ROUND2 = {
  title: 'Factory tracking screen for child products',

/* ---------------- generic canned evaluation for any new idea -------------- */
function genericEval(idea, roundNo, feedback){
  const words = idea.raw.trim().split(/\s+/).filter(Boolean).length;
  const first = idea.raw.trim().split(/(?<=[.!?])\s/)[0].slice(0,140);
  const ext = /customer|market|users|sell|subscription|pay|public|app store|business/i.test(idea.raw);
  const depth = ext ? (words > 80 ? 'Full' : 'Standard') : 'Light';
  const S = '<div style="font-size:11px;color:var(--text3);margin-bottom:8px">Sample text. In the real version the company writes this for your idea; here it shows the shape of the answer.</div>';
  return {
    title: (idea.title || first.replace(/^["'“]/,'').slice(0,60)),
    depth,
    depthReason: ext ? 'Your words point at people outside the company (users, customers, a market), so the competitor and threat sections are worth producing.' : 'Nothing in your words points outside the company, so the market sections would cost more than they change.',
    roster: ext ? [['Product','always on the roster.'],['CEO','the idea has an outside audience, so positioning matters.'],['Red Team','someone has to try to break it before anyone builds it.'],['Financial','only because money changes hands.']]
                : [['Product','always on the roster.'],['Red Team','someone has to try to break it before anyone builds it.']],
    left: ext ? [['Security','nothing sensitive named yet; joins later if the brief adds identity or payments.']] : [['CEO, Financial, Security','no market, no money, no sensitive data in play.']],
    q: {
      1:[S+'<b>Here is what we read:</b> “'+esc(first)+(first.length<idea.raw.trim().length?'…':'')+'” in your words, which we take to mean a '+(ext?'product for people outside the company':'tool for your own use')+'. If that is already wrong, use <b>Correct us</b> and tell us in one line.', '<div class="sk">1 · Original idea</div>Preserved verbatim on the left.<div class="sk">2 · What we think you mean</div>The interpretation is a few sentences, never a sentence-by-sentence paraphrase.'],
      2:[S+'The outcome behind the request, stated as a result you would notice, not a feature you asked for.', '<div class="sk">3 · What you are really trying to achieve</div>Written to the standard: “open it and know within seconds…”, never “you want a dashboard”.'],
      3:[S+'The genuine merits, and only those. <b>If the merits are weak the company says so here</b>; an idea is never praised because you proposed it.', '<div class="sk">4 · Why this may be valuable</div>User problem · convenience · speed · cost · underserved users · strategic value · new capability.'],
      4:[S+(ext?'<b>We don\'t know yet, and here is why.</b> Three to five relevant alternatives would be named here, each labelled. Today every label would read <span class="lab">COMPANY INFERENCE</span> or <span class="lab unk">UNKNOWN</span>, because no agent in this company can browse the web.':'<b>We don\'t know, and here is why.</b> Nothing outside the company chooses this, so what exists cannot change the recommendation. We did not look and cannot look.'), '<div class="sk">5 · Known competitors / alternatives'+(ext?'':' <span class="na">NOT PRODUCED</span>')+'</div>'+(ext?'What they offer · overlap · where stronger · where we could differ. Substitutes count.':'Depth is Light.')+'<div class="sk">6 · Competitor data freshness</div><b>Standing disclosure:</b> research has not been performed.'],
      5:[S+'<b>We do not yet see a strong differentiation.</b> That sentence is allowed to be the whole answer.', '<div class="sk">7 · Competitive advantages</div>Only differentiation the body supports.'],
      6:[S+'Only the threats that could change <b>whether or how</b> we build it. Not a risk register.', '<div class="sk">8 · Threats</div>Grouped by category, each with “changes how we build it” or “changes what we build first”.'],
      7:[S+'<b>One recommendation, never five options.</b> What we build first, what we intentionally postpone, and, if a simpler version has a better chance, that version instead.', '<div class="sk">9 · Recommended direction</div><div class="two" style="margin-top:8px"><div><div class="sk">10 · In scope now</div>Populated.</div><div><div class="sk">10 · Not in the first version</div>Populated. This is what stops a small idea becoming a huge project.</div></div><div class="sk">12 · Alternatives</div>Zero to three. Zero is a pass.'],
      8:[S+'Only assumptions that could change the result. Each one is correctable: tell us it is wrong and the brief changes.', '<div class="sk">11 · Important assumptions</div>No trivia.'],
      9:[S+'<b>Zero to three questions.</b> A question appears only if two honest answers would produce two different briefs, and each says what changes. You can always approve without answering.', '<div class="sk">13 · What we need from you</div>The stakes line per question.'],
      10:[S+'A definition concrete enough that Design, Development and QA know what “done” means, and that you would recognise as the thing you asked for.', '<div class="sk">14 · Definition of success</div>Downstream-facing as well as Founder-facing.'],
    },
    view: {opp:'Unclear', why:'Sample judgment. In the real version this is the company\'s closing view of your idea in two to four sentences, with no score, meter or percentage anywhere on it.', merit:'Sample.', threat:'Sample.', diff:'None we can see yet.', rec: ext ? 'Investigate first' : 'Proceed with narrowed scope'},
    changed: roundNo>1 ? ('Re-read with your note: “'+esc(feedback||'you edited the idea')+'”. In the real version this paragraph names exactly what changed since round '+(roundNo-1)+'.') : null,
  };
}

/* ------------------------------- state ---------------------------------- */
const KEY='ideaDesk.mock.v1';
let S = load();
function seed(){
  const now = Date.now();
  return { view:'list', cur:null, depthMode:'concise', ideas:[
    { id:'ex1', title:'Factory tracking screen for child products', raw:EX_RAW, audience:'Me. The founder, on my own machine.', trigger:'I could not find the meetings page; thirteen tabs of text.',
      status:'evaluated', createdAt: now-86400000*2,
      rounds:[ {n:1, at: now-86400000*2+600000, note:null, evalv:EX_ROUND1, feedback:EX_FEEDBACK}, {n:2, at: now-86400000*2+1500000, note:'reconsider', evalv:EX_ROUND2, feedback:null} ],
      approvedRound:null, approvedAt:null }
  ]};
}
function load(){ try{ const j=localStorage.getItem(KEY); if(j){ const s=JSON.parse(j); if(s&&s.ideas) return s; } }catch(e){} return seed(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function ago(t){ const d=Math.max(0,Date.now()-t); const m=Math.round(d/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<48) return h+' h ago'; return Math.round(h/24)+' d ago'; }
function idea(){ return S.ideas.find(i=>i.id===S.cur); }
function lastRound(i){ return i.rounds[i.rounds.length-1]; }
function go(view, id){ S.view=view; if(id!==undefined) S.cur=id; S.panel=null; save(); render(); window.scrollTo({top:0}); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

/* ------------------------------- render --------------------------------- */
function render(){
  const app=document.getElementById('app'), bar=document.getElementById('bar'), crumb=document.getElementById('crumb');
  bar.innerHTML=''; crumb.innerHTML='';
  if(S.view==='list') return app.innerHTML=viewList();
  if(S.view==='new'){ crumb.innerHTML='<span>/</span><b>'+(S.editing?'Edit idea':'New idea')+'</b>'; return app.innerHTML=viewNew(); }
  if(S.view==='evaluating'){ crumb.innerHTML='<span>/</span><b>Evaluating</b>'; app.innerHTML=viewEvaluating(); return runEvaluating(); }
  if(S.view==='idea'){ const i=idea(); crumb.innerHTML='<span>/</span><b>'+esc(i.title)+'</b>'; app.innerHTML=viewIdea(i); bar.innerHTML=viewBar(i); return; }
}

function viewList(){
  const rows = S.ideas.slice().sort((a,b)=>b.createdAt-a.createdAt).map(i=>{
    const r=lastRound(i);
    const line = i.status==='draft' ? 'Saved, not evaluated yet.' : i.status==='approved' ? 'Approved brief · round '+i.approvedRound : i.status==='parked' ? 'Parked after round '+r.n : i.status==='dropped' ? 'Dropped after round '+r.n : 'Round '+r.n+' · '+r.evalv.view.rec;
    return `<button class="row" onclick="go('idea','${i.id}')">
      <div><div class="t">${esc(i.title||'(untitled)')}</div><div class="d">${esc(i.raw)}</div></div>
      <span class="st ${i.status}">${i.status}</span>
      <div class="when">${ago(r?r.at:i.createdAt)}<br><span style="color:var(--text3);font-family:var(--sans);font-size:12px">${esc(line)}</span></div>
    </button>`;}).join('');
  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:40px;flex-wrap:wrap">
      <div><h1>Bring an idea to the company</h1>
        <p class="sub" style="margin:10px 0 0">You write it in your own words. The company works out what you mean, tells you what it thinks of it, and asks only what it genuinely needs. Nothing gets built until you approve the brief.</p></div>
      <button class="btn primary" onclick="S.editing=null;S.draft={};go('new')">+ New idea</button>
    </div>
    <div class="list">${rows || '<div class="empty">No ideas saved yet.</div>'}</div>
    <div class="foot">This page is a mockup of the idea-evaluation journey only. The answers are canned; no model runs, nothing leaves this page, and approving does not start the factory. Your ideas are kept in this browser only. <button onclick="if(confirm('Reset the mockup to its starting state?')){S=seed();save();render();}">Reset mockup data</button></div>`;
}

function viewNew(){
  const d=S.draft||{};
  const editing = S.editing ? idea() : null;
  return `
    <div style="margin-top:40px"><h1>${editing?'Edit your idea':'What do you want to build?'}</h1>
    <p class="sub" style="margin:10px 0 0">${editing?'Your original words from round 1 stay on record. This edit starts a new round.':'Write it the way you would say it out loud. Do not tidy it. The company\'s first job is to work out what you mean, and it does that better from your real words.'}</p></div>
    <div class="form">
      <div class="field"><label for="raw">In your own words</label>
        <textarea id="raw" placeholder="the current UI so much verbose, it should be as simple as a dashboard…">${esc(d.raw||'')}</textarea>
        <div class="hint">Kept exactly as typed. Never edited by the company.</div></div>
      <div class="two">
        <div class="field"><label for="aud">Who is it for? <span style="color:var(--text3);font-weight:400">optional</span></label><input id="aud" value="${esc(d.audience||'')}" placeholder="me · my team · the public"></div>
        <div class="field"><label for="trg">What made you think of it? <span style="color:var(--text3);font-weight:400">optional</span></label><input id="trg" value="${esc(d.trigger||'')}" placeholder="a moment, a complaint, a thing you couldn't find"></div>
      </div>
      <div class="actions">
        <button class="btn primary" onclick="submitNew(true)">Evaluate idea</button>
        <button class="btn" onclick="submitNew(false)">Save without evaluating</button>
        <button class="btn ghost" onclick="go(${editing?"'idea'":"'list'"})">Cancel</button>
      </div>
      <div class="note">Evaluating asks two to four company roles to read this and the Chief of Staff to write one answer. In the real version that costs model time and you are shown who was asked and why. Here it is instant and canned.</div>
    </div>`;
}
function submitNew(evaluate){
  const raw=document.getElementById('raw').value.trim();
  if(!raw){ toast('Write the idea first.'); document.getElementById('raw').focus(); return; }
  const audience=document.getElementById('aud').value.trim(), trigger=document.getElementById('trg').value.trim();
  let i;
  if(S.editing){ i=idea(); i.raw=raw; i.audience=audience; i.trigger=trigger; i.pendingNote='edit'; }
  else {
    i={ id:'i'+Date.now().toString(36), title:'', raw, audience, trigger, status:'draft', createdAt:Date.now(), rounds:[], approvedRound:null, approvedAt:null, edits:[] };
    S.ideas.push(i); S.cur=i.id;
  }
  if(S.editing){ (i.edits=i.edits||[]).push({at:Date.now(), raw}); }
  S.editing=null; S.draft={};
  if(evaluate) go('evaluating'); else { save(); go('idea'); toast('Saved.'); }
}

function viewEvaluating(){
  const i=idea(); const n=i.rounds.length+1;
  return `<div class="evalbox">
    <div class="k">Round ${n}</div>
    <h1 style="margin-top:8px"><span class="spin"></span>The company is considering your idea</h1>
    <p class="sub" style="margin:12px 0 0">They read it separately. They may disagree. You will not be handed the argument; the Chief of Staff brings you one answer.</p>
    <div id="lines" style="margin-top:28px"></div>
    <div style="margin-top:20px"><button class="btn ghost sm" onclick="finishEvaluating()">Skip the wait</button></div>
  </div>`;
}
let evalTimer=null;
function runEvaluating(){
  const i=idea(); const n=i.rounds.length+1;
  const lines = n===1 ? [
    ['Product','Reading it as written.','Not rewriting it.'],
    ['Chief of Staff','Choosing who should weigh in on this idea.','Not everyone. Only roles that could change the reading.'],
    ['Red Team','Looking for how it fails before anyone builds it.',''],
    ['Product','Naming the outcome behind the request.','The result you would notice, not the feature you asked for.'],
    ['Chief of Staff','Writing one answer.','Ten questions, then the company view.'],
  ] : [
    ['Chief of Staff','Re-reading with your note.','Your original words stay on record; the note sits beside them.'],
    ['Chief of Staff','Re-choosing the roster.','Some roles join, some drop, and the reason for each is shown.'],
    ['Product','Redoing the interpretation.',''],
    ['Chief of Staff','Writing what changed since round '+(n-1)+'.','So you can see the difference, not reread everything.'],
  ];
  const box=document.getElementById('lines'); let k=0;
  clearInterval(evalTimer);
  evalTimer=setInterval(()=>{
    if(k>=lines.length){ clearInterval(evalTimer); setTimeout(finishEvaluating, 700); return; }
    const [who,what,small]=lines[k++];
    const el=document.createElement('div'); el.className='line';
    el.innerHTML=`<div class="who">${who}</div><div class="what">${what}${small?`<small>${small}</small>`:''}</div>`;
    box.appendChild(el); requestAnimationFrame(()=>el.classList.add('on'));
  }, 900);
}
function finishEvaluating(){
  clearInterval(evalTimer);
  const i=idea(); if(!i || S.view!=='evaluating') return;
  const n=i.rounds.length+1;
  const fb = i.pendingFeedback||null; const note = i.pendingNote||null;
  let ev;
  if(i.id==='ex1') ev = n===1?EX_ROUND1:EX_ROUND2; else ev = genericEval(i, n, fb||note);
  if(!i.title) i.title=ev.title;
  if(i.rounds.length){ lastRound(i).feedback = fb || (note==='edit'?'(you edited the idea)':null); }
  i.rounds.push({n, at:Date.now(), note, evalv:ev, feedback:null});
  i.status='evaluated'; i.pendingFeedback=null; i.pendingNote=null;
  save(); go('idea');
}

function viewIdea(i){
  const r=lastRound(i);
  if(!r) return viewDraft(i);
  const approved = i.status==='approved'; const ev = r.evalv;
  const full = S.depthMode==='full';
  const qs = QUESTIONS.map(([n,title,voice,xl])=>{
    const [a,x]=ev.q[n]; const v=VOICE[voice];
    return `<div class="qa ${voice==='need'?'need':''}" style="--v:${v.c}">
      <div class="qh"><span class="n">Q${n}</span><span class="qt">${title}</span><span class="v">${v.name}</span></div>
      <div class="a ${n===2?'big':''}">${a}</div>
      <div class="x ${full?'open':''}"><button onclick="this.parentElement.classList.toggle('open')">Expanded · ${xl}</button><div class="xin">${x}</div></div>
    </div>`;}).join('');
  const roster = `<div class="qa" style="--v:var(--text3);border-left-color:var(--border2)"><div class="qh"><span class="qt" style="font-size:13.5px;color:var(--text2)">Who weighed in, and why</span><span class="v" style="color:var(--text3)">Depth ${esc(ev.depth)}</span></div>
      <div class="a" style="font-size:13px">${ev.roster.map(([w,r])=>`<b>${esc(w)}</b> — ${esc(r)}`).join('<br>')}<div style="margin-top:8px;color:var(--text3)">${ev.left.map(([w,r])=>`<b style="color:var(--text3)">Left out: ${esc(w)}</b> — ${esc(r)}`).join('<br>')}</div><div style="margin-top:8px;color:var(--text3)">Depth reason: ${esc(ev.depthReason)}</div></div></div>`;
  const cv = ev.view;
  return `
    <div class="head">
      <div><div class="k">Idea · round ${r.n} of ${i.rounds.length}</div><h1 style="margin-top:6px">${esc(i.title)}</h1>
        <div class="meta" style="margin-top:10px"><span class="st ${i.status}">${i.status}</span><span class="chip">Depth: ${esc(ev.depth)}</span><span>${ago(r.at)}</span>${approved?`<span class="chip" style="color:var(--green)">Approved round ${i.approvedRound} · ${ago(i.approvedAt)}</span>`:''}</div></div>
      <div class="voices">${Object.values(VOICE).map(v=>`<span style="--c:${v.c}">${v.name}</span>`).join('')}</div>
    </div>
    ${(i.status==='parked'||i.status==='dropped')?`<div class="banner gray"><b style="color:var(--text)">${i.status==='parked'?'Parked.':'Dropped.'}</b> ${i.status==='parked'?'Not being built now; you can come back to it.':'Not being built. Kept as a record, together with what the company said.'} ${i.closeReason?`Your reason: “${esc(i.closeReason)}”`:''}</div>`:''}
    ${approved?`<div class="banner green"><b>This is the approved brief.</b> Round ${i.approvedRound} is now the single source of truth for anything built from this idea. The original idea and every earlier round stay stored underneath it, unchanged.</div>`:''}
    ${ev.changed?`<div class="banner blue"><b>What changed since round ${r.n-1}:</b> ${ev.changed}</div>`:''}
    <div class="cols">
      <aside class="side">
        <div class="you"><div class="k" style="color:var(--gray)">You said · never edited</div><div class="q">“${esc(i.raw)}”</div>
          ${i.audience?`<div class="aud"><b style="color:var(--text3)">For:</b> ${esc(i.audience)}</div>`:''}${i.trigger?`<div class="aud"><b style="color:var(--text3)">Because:</b> ${esc(i.trigger)}</div>`:''}</div>
        <div class="hist"><div class="k">What is stored</div>
          <div class="h-item raw"><span class="dot"></span><div><b>Original idea</b> · ${ago(i.createdAt)}<br>Your words, verbatim. Artifact 1.</div></div>
          ${i.rounds.map(rr=>`<div class="h-item ${rr.n===r.n&&!approved?'cur':''} ${approved&&rr.n===i.approvedRound?'ok':''}"><span class="dot"></span><div><b>Round ${rr.n}</b> · company reading · ${ago(rr.at)}${rr.n===i.approvedRound?' · <span style="color:var(--green)">approved</span>':''}<br>${rr.evalv.view.rec}${rr.feedback?`<div class="fb">You: “${esc(rr.feedback)}”</div>`:''}</div></div>`).join('')}
          ${(i.status==='parked'||i.status==='dropped')?`<div class="h-item"><span class="dot"></span><div><b>You ${i.status} it</b> · ${ago(i.closedAt)}<br>${i.closeReason?esc(i.closeReason):'No reason given.'}</div></div>`:''}
          ${approved?`<div class="h-item ok"><span class="dot"></span><div><b>Approved brief</b> · ${ago(i.approvedAt)}<br>Artifact 3. Downstream reads only this.</div></div>`:''}
        </div>
      </aside>
      <main>
        <div class="toolbar">
          <div class="depth">Read it <div class="seg"><button class="${!full?'on':''}" onclick="S.depthMode='concise';save();render()">Concise · 2 min</button><button class="${full?'on':''}" onclick="S.depthMode='full';save();render()">Full depth</button></div></div>
          <div style="font-size:12px;color:var(--text3)">Everything needed to decide is in the concise layer. Full depth is for checking the decision.</div>
        </div>
        <div class="qs">${roster}${qs}</div>
        <div class="cv"><div class="cvh"><span class="k">Company view</span><small>Executive judgment · not a score · always visible</small></div>
          <div class="cvg">
            <div class="k">Opportunity</div><div class="val opp" style="color:${cv.opp==='High'?'var(--green)':cv.opp==='Low'?'var(--red)':'var(--text)'}">${esc(cv.opp)}</div>
            <div class="k">Why</div><div class="val">${esc(cv.why)}</div>
            <div class="k">Biggest merit</div><div class="val">${esc(cv.merit)}</div>
            <div class="k" style="color:var(--red)">Biggest threat</div><div class="val">${esc(cv.threat)}</div>
            <div class="k">Best differentiation</div><div class="val">${esc(cv.diff)}</div>
            <div class="k" style="color:var(--accent)">Recommendation</div><div class="val"><span class="rec">${esc(cv.rec)}</span></div>
          </div>
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--dim)">Six fields, the same six every time. The four recommendations this company can give: Proceed · Proceed with narrowed scope · Investigate first · Reconsider.</div>
        </div>
        <div id="panel">${S.panel==='reconsider'?panelReconsider(i):S.panel==='approve'?panelApprove(i):S.panel==='close'?panelClose(i):approved?panelApproved(i):''}</div>
      </main>
    </div>`;
}
function viewDraft(i){
  return `<div class="head"><div><div class="k">Idea · saved, not evaluated</div><h1 style="margin-top:6px">${esc(i.title||'Untitled idea')}</h1><div class="meta" style="margin-top:10px"><span class="st draft">draft</span><span>${ago(i.createdAt)}</span></div></div></div>
    <div class="cols"><aside class="side"><div class="you"><div class="k" style="color:var(--gray)">You said · never edited</div><div class="q">“${esc(i.raw)}”</div></div></aside>
    <main><div class="banner blue">Nothing has been evaluated yet. When you are ready, the company reads it and comes back with one answer.</div>
    <div class="actions" style="margin-top:18px"><button class="btn primary" onclick="go('evaluating')">Evaluate idea</button><button class="btn" onclick="S.editing=S.cur;S.draft={raw:idea().raw,audience:idea().audience,trigger:idea().trigger};go('new')">Edit</button><button class="btn ghost" onclick="if(confirm('Delete this idea?')){S.ideas=S.ideas.filter(x=>x.id!==S.cur);go('list');}">Delete</button></div></main></div>`;
}
function viewBar(i){
  if(!i.rounds.length) return '';
  if(i.status==='approved') return `<div class="bar"><div class="bar-in"><span class="why">Approved. In the real version the next button hands this brief to the factory. Here it is deliberately not connected.</span>
    <button class="btn" onclick="go('list')">Back to ideas</button><button class="btn primary" onclick="toast('Not connected yet. If you like this, that is the next piece we add.')">Start work</button></div></div>`;
  if(i.status==='parked'||i.status==='dropped') return `<div class="bar"><div class="bar-in"><span class="why">${i.status==='parked'?'Parked. Reopening puts it back exactly where it was, at round '+lastRound(i).n+'.':'Dropped. It stays on record; reopening is allowed if you change your mind.'}</span>
    <button class="btn" onclick="go('list')">Back to ideas</button><button class="btn" onclick="const x=idea(); x.status='evaluated'; x.closeReason=null; x.closedAt=null; save(); render(); toast('Reopened at round '+lastRound(x).n+'.')">Reopen</button></div></div>`;
  return `<div class="bar"><div class="bar-in"><span class="why">Four things you can do with round ${lastRound(i).n}. Nothing is built by any of them.</span>
    <button class="btn ghost" onclick="S.panel='close';save();render();document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'center'})">Not building this</button>
    <button class="btn" onclick="S.editing=S.cur;S.draft={raw:idea().raw,audience:idea().audience,trigger:idea().trigger};go('new')">Edit my idea</button>
    <button class="btn" onclick="S.panel='reconsider';save();render();document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'center'})">Correct us</button>
    <button class="btn ok" onclick="S.panel='approve';save();render();document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'center'})">Approve brief</button></div></div>`;
}
function panelReconsider(i){
  return `<div class="panel"><h3>Correct us: what did the company get wrong?</h3><p>One or two lines is enough. This does not change your idea; the note is stored beside it and the company re-reads both and comes back with a new round. If it is your idea you want to change, use Edit my idea instead.</p>
    <textarea id="fb" style="min-height:90px" placeholder="${i.id==='ex1'?'e.g. the ellipse is a requirement, not a sketch':'almost there, but…'}"></textarea>
    <div class="actions" style="margin-top:12px"><button class="btn primary" onclick="const v=document.getElementById('fb').value.trim(); if(!v){toast('Say what was wrong first.');return;} idea().pendingFeedback=v; idea().pendingNote='reconsider'; go('evaluating')">Send and re-evaluate</button><button class="btn ghost" onclick="S.panel=null;save();render()">Cancel</button></div></div>`;
}
function panelClose(i){
  return `<div class="panel"><h3>Not building this</h3><p>Nothing is deleted. Your idea and everything the company said about it stay on record. <b>Park</b> means you may come back to it; <b>Drop</b> means you have decided against it. Either can be reopened.</p>
    <textarea id="why" style="min-height:70px" placeholder="Why, in a line. Optional, but the record is better with it."></textarea>
    <div class="actions" style="margin-top:12px"><button class="btn" onclick="closeIdea('parked')">Park it</button><button class="btn" onclick="closeIdea('dropped')">Drop it</button><button class="btn ghost" onclick="S.panel=null;save();render()">Cancel</button></div></div>`;
}
function closeIdea(how){ const x=idea(); x.status=how; x.closeReason=(document.getElementById('why').value||'').trim()||null; x.closedAt=Date.now(); S.panel=null; save(); render(); toast(how==='parked'?'Parked. Nothing was built.':'Dropped. Kept on record.'); }
function panelApprove(i){
  const r=lastRound(i);
  return `<div class="panel g"><h3>Approve round ${r.n} as the brief</h3><p>From this point on, anyone working on this idea reads the approved brief, never your raw words and never an earlier round. Both stay stored underneath it, unchanged. Approving does not start any work.</p>
    <div class="arts">
      <div class="art"><span class="k">Artifact 1</span><span>Original idea, your words, verbatim</span><span class="m">kept</span></div>
      ${i.rounds.map(rr=>`<div class="art"><span class="k">Artifact 2 · r${rr.n}</span><span>Company reading, round ${rr.n}${rr.feedback?' + your note':''}</span><span class="m">kept</span></div>`).join('')}
      <div class="art" style="border:1px solid oklch(72% 0.15 150 / .5)"><span class="k" style="color:var(--green)">Artifact 3</span><span>Approved brief = round ${r.n}, frozen</span><span class="m">created now</span></div>
    </div>
    <div class="actions"><button class="btn ok" onclick="const x=idea(); x.status='approved'; x.approvedRound=lastRound(x).n; x.approvedAt=Date.now(); S.panel=null; save(); render(); toast('Approved. Nothing has started.')">Approve brief</button><button class="btn ghost" onclick="S.panel=null;save();render()">Not yet</button></div></div>`;
}
function panelApproved(i){
  return `<div class="panel g"><h3>What happens next, in the real version</h3><p>The approved brief becomes the only thing the factory is allowed to read for this idea. Design draws to it, Development builds to it, QA tests against its definition of success. None of that is connected here, on purpose: this page exists so you can judge the evaluation journey on its own first.</p></div>`;
}

(function(){ const h=(location.hash||'').slice(1); if(h && S.ideas.some(i=>i.id===h)){ S.view='idea'; S.cur=h; } })();
render();
</script>
